name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q founder_os apps tests tools
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Enforce production invariants
        run: python tools/production_check.py
      - name: Exercise deterministic demo
        run: python apps/founderos.py --demo --once --dry-run --explain

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix web
      - name: Build emulator frontend
        run: npm run build
