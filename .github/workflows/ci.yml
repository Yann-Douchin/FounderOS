name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked emulator dependencies
        run: npm ci
      - name: Compile Python sources
        run: python -m compileall -q founder_os apps tests tools
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Enforce production invariants
        run: python tools/production_check.py
      - name: Exercise deterministic demo
        run: python apps/founderos.py --demo --once --dry-run --explain

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix web
      - name: Build emulator frontend
        run: npm run build

  stream-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/stream-deck/package-lock.json
      - name: Install locked Stream Deck dependencies
        run: npm ci --prefix integrations/stream-deck
      - name: Verify the Stream Deck plugin
        run: npm run verify --prefix integrations/stream-deck
      - name: Verify the committed Stream Deck bundle is reproducible
        run: >-
          git diff --exit-code --
          integrations/stream-deck/com.yanndouchin.founderos-actions.sdPlugin/bin/plugin.js
      - name: Verify the profile generator
        run: >-
          python -m unittest discover
          -s integrations/stream-deck-profile/tests -v

  barpilot-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch the pinned BarPilot reference
        run: >-
          curl --proto '=https' --tlsv1.2 --fail --location
          https://raw.githubusercontent.com/nastea1/barpilot/5c4afe96e178982d7e5f95a9dfea0cf761804d80/barpilot.html
          --output /tmp/barpilot.html
      - name: Prove the endpoint contract against the pinned source
        run: python tools/barpilot_compat.py --source /tmp/barpilot.html --source-only
